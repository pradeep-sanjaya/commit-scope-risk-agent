[project]
name = "scope-agent"
version = "0.1.0"
description = "Commit scope and risk agent: Bitbucket push webhook + JIRA + LLM analysis, with a QA portal"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "httpx",
    "sqlalchemy",
    "psycopg[binary]",
    "pydantic",
    "pydantic-settings",
    "pyyaml",
    "jinja2",
    "anthropic",
    "typer",
    "structlog",
]

[project.scripts]
scope-agent = "scope_agent.cli:app"

[dependency-groups]
dev = ["pytest", "respx"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scope_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
